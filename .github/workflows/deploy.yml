name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build site (ZH_STRICT)
        run: ZH_STRICT=1 node src/build.mjs --site

      - name: Verify build output (Cloudflare Pages limits)
        run: |
          ls -la dist
          test $(find dist -type f | wc -l) -le 20000
          test $(find dist -type f -size +25M | wc -l) -eq 0

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=lucian-uxui-zh --branch=main
