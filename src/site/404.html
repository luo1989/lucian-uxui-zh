<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>页面不存在 · Lucian UX/UI Prompt 中文版</title>
<style>
  :root{color-scheme:light dark;--bg:#F4F2EE;--ink:#16151B;--ink2:#57535F;--line:rgba(22,21,27,.14);--accent:#6A57F2}
  @media (prefers-color-scheme:dark){:root{--bg:#07080D;--ink:#F2F0F6;--ink2:#A9A5B4;--line:rgba(255,255,255,.16)}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{max-width:520px;text-align:center}
  .num{font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:var(--ink2)}
  h1{margin:16px 0 0;font-size:clamp(28px,6vw,40px);line-height:1.15;letter-spacing:-.02em}
  p{margin:14px 0 0;font-size:15px;line-height:1.7;color:var(--ink2)}
  a{display:inline-flex;align-items:center;justify-content:center;margin-top:26px;height:44px;padding:0 22px;border-radius:999px;
    background:var(--ink);color:var(--bg);font-size:14px;font-weight:650;text-decoration:none;border:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <p class="num">404</p>
  <h1>这个页面不存在</h1>
  <p>链接可能已经失效，或者编号写错了。素材库的每个组件都可以用 <code>#001</code> 这样的编号直接定位。</p>
  <a href="/">回到素材库首页</a>
</main>
</body>
</html>
